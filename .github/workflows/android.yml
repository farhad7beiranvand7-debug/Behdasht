name: Build Android Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Build AAB and APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Android Scaffold if missing
        run: |
          if [ ! -d "android" ]; then
            flutter create . --platforms=android --org ir.pezeshk
          fi

      - name: Configure Desugaring and MinSDK
        run: |
          python3 -c '
          import os

          # Path detection (Groovy or Kotlin DSL)
          target_file = None
          for path in ["android/app/build.gradle.kts", "android/app/build.gradle"]:
              if os.path.exists(path):
                  target_file = path
                  break

          if not target_file:
              print("No gradle file found!")
              exit(1)

          with open(target_file, "r") as f:
              content = f.read()

          is_kts = target_file.endswith(".kts")

          if is_kts:
              # Kotlin DSL
              if "coreLibraryDesugaring" not in content:
                  if "dependencies {" in content:
                      content = content.replace("dependencies {", "dependencies {\n    coreLibraryDesugaring(\"com.android.tools:desugar_jdk_libs:2.0.4\")")
                  else:
                      content += "\ndependencies {\n    coreLibraryDesugaring(\"com.android.tools:desugar_jdk_libs:2.0.4\")\n}\n"

              if "isCoreLibraryDesugaringEnabled" not in content and "coreLibraryDesugaringEnabled" not in content:
                  content = content.replace("compileOptions {", "compileOptions {\n        isCoreLibraryDesugaringEnabled = true")

              # Ensure minSdkVersion is at least 21
              content = content.replace("minSdk = flutter.minSdkVersion", "minSdk = 21")
          else:
              # Groovy DSL
              if "coreLibraryDesugaring" not in content:
                  if "dependencies {" in content:
                      content = content.replace("dependencies {", "dependencies {\n    coreLibraryDesugaring \"com.android.tools:desugar_jdk_libs:2.0.4\"")
                  else:
                      content += "\ndependencies {\n    coreLibraryDesugaring \"com.android.tools:desugar_jdk_libs:2.0.4\"\n}\n"

              if "coreLibraryDesugaringEnabled" not in content:
                  content = content.replace("compileOptions {", "compileOptions {\n        coreLibraryDesugaringEnabled true")

              content = content.replace("minSdkVersion flutter.minSdkVersion", "minSdkVersion 21")

          with open(target_file, "w") as f:
              f.write(content)
          '

      - name: Install Dependencies
        run: flutter pub get

      - name: Build App Bundle (AAB for Cafe Bazaar)
        run: flutter build appbundle --release --no-tree-shake-icons

      - name: Build APK (for Testing)
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-builds
          path: |
            build/app/outputs/bundle/release/*.aab
            build/app/outputs/flutter-apk/*.apk
          retention-days: 30
