name: Build Android Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Build AAB and APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Android Scaffold if missing
        run: |
          if [ ! -d "android" ]; then
            flutter create . --platforms=android --org ir.pezeshk
          fi

      - name: Configure Desugaring and MinSDK
        run: |
          GRADLE_FILE="android/app/build.gradle"
          if [ -f "android/app/build.gradle.kts" ]; then
            GRADLE_FILE="android/app/build.gradle.kts"
          fi

          python3 -c '
          with open("android/app/build.gradle", "r") as f:
              content = f.read()

          # Ensure coreLibraryDesugaring dependency exists
          if "coreLibraryDesugaring" not in content:
              content = content.replace("dependencies {", "dependencies {\n    coreLibraryDesugaring \"com.android.tools:desugar_jdk_libs:2.0.4\"")

          # Ensure compileOptions has coreLibraryDesugaringEnabled true
          if "coreLibraryDesugaringEnabled" not in content:
              content = content.replace("compileOptions {", "compileOptions {\n        coreLibraryDesugaringEnabled true")

          with open("android/app/build.gradle", "w") as f:
              f.write(content)
          '

      - name: Install Dependencies
        run: flutter pub get

      - name: Build App Bundle (AAB for Cafe Bazaar)
        run: flutter build appbundle --release --no-tree-shake-icons

      - name: Build APK (for Testing)
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-builds
          path: |
            build/app/outputs/bundle/release/*.aab
            build/app/outputs/flutter-apk/*.apk
          retention-days: 30
