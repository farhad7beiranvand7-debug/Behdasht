name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: stable
          cache: true

      - name: Recreate Android Project
        run: |
          rm -rf android
          flutter create . --platforms=android --org ir.pezeshk --project-name behdasht

      - name: Configure Android Gradle KTS
        run: |
          python3 -c '
          path = "android/app/build.gradle.kts"
          with open(path, "r") as f:
              content = f.read()

          # تنظیم NDK Version
          content = content.replace("android {", "android {\n    ndkVersion = \"27.0.12077973\"")

          # فعال‌سازی Desugaring در compileOptions
          content = content.replace("compileOptions {", "compileOptions {\n        isCoreLibraryDesugaringEnabled = true")

          # اضافه کردن بلوک dependencies در انتهای فایل
          desugar_dep = "\n\ndependencies {\n    coreLibraryDesugaring(\"com.android.tools:desugar_jdk_libs:2.0.4\")\n}\n"
          content += desugar_dep

          with open(path, "w") as f:
              f.write(content)
          '

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: behdasht-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
