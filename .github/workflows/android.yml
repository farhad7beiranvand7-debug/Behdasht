name: Build Android Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: Generate Android Scaffold if missing
        run: |
          if [ ! -d "android" ]; then
            flutter create . --org com.pezeshk.khanevadeh --project-name pezeshk_khanevadeh
          fi

      - name: Configure Desugaring and MinSDK
        run: |
          BUILD_GRADLE="android/app/build.gradle"
          if grep -q "minSdkVersion" "$BUILD_GRADLE"; then
            sed -i 's/minSdkVersion .*/minSdkVersion 21/g' "$BUILD_GRADLE"
          fi
          if ! grep -q "coreLibraryDesugaring" "$BUILD_GRADLE"; then
            sed -i '/compileOptions {/a \        coreLibraryDesugaringEnabled true' "$BUILD_GRADLE"
            sed -i '/dependencies {/a \    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.0.4"' "$BUILD_GRADLE"
          fi

      - name: Setup Signing Keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks
            cat <<EOF > android/key.properties
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOF

            BUILD_GRADLE="android/app/build.gradle"
            sed -i '/buildTypes {/i \
            signingConfigs {\
                release {\
                    def keystoreProperties = new Properties()\
                    def keystorePropertiesFile = rootProject.file("key.properties")\
                    if (keystorePropertiesFile.exists()) {\
                        keystoreProperties.load(new FileInputStream(keystorePropertiesFile))\
                    }\
                    keyAlias = keystoreProperties["keyAlias"]\
                    keyPassword = keystoreProperties["keyPassword"]\
                    storeFile = keystoreProperties["storeFile"] ? file(keystoreProperties["storeFile"]) : null\
                    storePassword = keystoreProperties["storePassword"]\
                }\
            }' "$BUILD_GRADLE"
            sed -i 's/signingConfig signingConfigs.debug/signingConfig signingConfigs.release/g' "$BUILD_GRADLE"
          fi

      - name: Install Dependencies
        run: flutter pub get

      - name: Build App Bundle (AAB for Cafe Bazaar)
        run: flutter build appbundle --release

      - name: Build APK (for Testing)
        run: flutter build apk --release

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-builds
          path: |
            build/app/outputs/bundle/release/*.aab
            build/app/outputs/flutter-apk/*.apk
